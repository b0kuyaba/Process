<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../css/sign_up.css">
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<main>
  <div id="frame">
    <h1>회원가입</h1>

    <div>
      <div id="fail_Sign_Up">
        <p>중복된 아이디입니다.</p><span>아이디를 바꿔서 다시 시도해주세요.</span>
      </div>
      <div id="success_Sign_Up">
        <p>회원가입에 성공하였습니다.</p><span>로그인을 진행해주세요.</span>
      </div>
      <form id="sign_Up_Form">
        <label id="top_box">
          <input type="text" id="id_Request" name="username" placeholder="아이디 입력" class="btn">
        </label>
        <label>
          <input type="password" id="pw_Request" name="password" placeholder="비밀번호 입력" class="btn">
        </label>
        <button type="button" value="회원가입" id="sign_Up_Box" class="btn">회원가입</button>
        <div>
          <label id="login">
            <a target="_blank" href="login.html">로그인 하러 가기</a>
          </label>
          <label id="delete_info">
            <a target="_blank" href="delete_info.html">정보 삭제하기</a>
          </label>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="../js/userinfor.js"></script>
</body>
</html>
